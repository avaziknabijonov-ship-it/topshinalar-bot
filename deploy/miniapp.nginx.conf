# Replace the example subdomain before installing, then obtain HTTPS with certbot.
# certbot --nginx adds the 443 server block; keep the headers/limits below inside it too
# (copy the "add_header" lines and the "location" limits), then enable HSTS only after HTTPS works.
limit_req_zone $binary_remote_addr zone=topshinalar_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=topshinalar_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=topshinalar_conn:10m;

server {
    listen 80;
    server_name bot.example.uz;
    server_tokens off;
    client_max_body_size 6m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn topshinalar_conn 30;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # After certbot has issued the certificate, uncomment:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Code approvals: a person needs a handful of attempts, a script needs thousands.
    location ~ ^/(director-auth|desktop-auth)/(start|telegram)$ {
        limit_req zone=topshinalar_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/topshinalar-proxy.inc;
    }
    location / {
        limit_req zone=topshinalar_api burst=80 nodelay;
        limit_req_status 429;
        include /etc/nginx/topshinalar-proxy.inc;
    }
}
