name: Bot tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-uzb
      - run: pip install -r requirements.txt
      - run: python -m pip install pip-audit && pip-audit -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/web/*.test.js
      - run: docker build -t topshinalar-ci .
      - run: docker run --rm --network none topshinalar-ci python -c "import core, miniapp, director, backup, company_documents; from ui_text import browser_script; from pathlib import Path; assert browser_script().startswith('window.WorkspaceTextData='); assert not list(Path('assets/quotation-attachments').glob('*'))"
