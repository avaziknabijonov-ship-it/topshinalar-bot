name: Bot tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-uzb
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node tests/web/api_retry.test.js
      - run: node tests/web/mobile_keyboard.test.js
      - run: node tests/web/pdf_chat.test.js
