name: Windows installer
# Builds TOPSHINALAR-Setup-<version>.exe on a Windows runner. Manual run (or a v* tag); never deploys anything.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server manzili (masalan https://bot.example.uz). Bo'sh = ilova birinchi ishga tushganda so'raydi"
        required: false
        default: ""
  push:
    tags: ["desktop-v*"]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          TOPSHINALAR_SERVER_URL: ${{ inputs.server_url || vars.TOPSHINALAR_SERVER_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TOPSHINALAR-Windows-installer
          path: desktop/dist/TOPSHINALAR-Setup-*.exe
          if-no-files-found: error
